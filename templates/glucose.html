<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Glucose - Sugar Watch</title>
</head>

<body>

    <h1>Glucose</h1>

    <h2>Add Reading</h2>

    <form method="post" action="/glucose">

        <label for="glucose">
            Glucose (mg/dL)
        </label>

        <input
            type="number"
            id="glucose"
            name="glucose"
            min="20"
            max="600"
            required
        >

        <br><br>

        <label for="timestamp">
            Date and Time
        </label>

        <input
            type="datetime-local"
            id="timestamp"
            name="timestamp"
            required
        >

        <br><br>

        <button type="submit">
            Save Reading
        </button>

    </form>

    <hr>

    <h2>Recent Readings</h2>

    {% if readings %}

        <table border="1">

            <tr>
                <th>Date/Time</th>
                <th>Glucose</th>
                <th>Source</th>
            </tr>

            {% for reading in readings %}

                <tr>
                    <td>{{ reading.timestamp }}</td>
                    <td>{{ reading.glucose }} mg/dL</td>
                    <td>{{ reading.source }}</td>
                </tr>

            {% endfor %}

        </table>

    {% else %}

        <p>No glucose readings yet.</p>

    {% endif %}

    <br>

    <a href="/">Back to Home</a>

</body>
</html>
