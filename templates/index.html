<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
</head>

<body>

    <h1>Sugar Watch</h1>

    {% if user %}

        <h2>Welcome, {{ user.name }}</h2>

        <p>{{ user.email }}</p>

        {% if user.picture %}
            <img
                src="{{ user.picture }}"
                alt="Profile picture"
                width="80"
            >
        {% endif %}

        <br><br>

        <a href="/logout">Log out</a>

    {% else %}

        <p>Track your glucose, food, and exercise.</p>

        <a href="/login">
            <button>Sign in with Google</button>
        </a>

    {% endif %}

</body>
</html>
